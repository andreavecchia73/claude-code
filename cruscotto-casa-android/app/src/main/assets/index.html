/* Layout: header con selettore Energia/Bollette/Gas/Costi e stato dati → controlli → riquadri → grafici progressivi → tabella mensile */
:root {
  --bg: #f6f7f5;

  --accent: #1f6f5c;
  --accent-ink: #ffffff;
  --y0: #2a78d6;   /* anno corrente */
  --y1: #eb6834;   /* anno -1 */
  --y2: #1baf7a;   /* anno -2 */
  --good: #006300;
  --bad: #c62f2f;
  --good-wash: rgba(12,163,12,0.10);
  --bad-wash: rgba(208,59,59,0.10);
  --warn-wash: rgba(250,178,25,0.18);
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}

  :root:not([data-theme="light"]) {
    --bg: #0e1110; --surface: #171b19; --ink: #f3f5f4; --ink-2: #c0c7c3; --muted: #8a918d;
    --grid: #262c29; --axis: #39403c; --zero: #6b736e; --border: rgba(255,255,255,0.10); --accent: #5cc4a6; --accent-ink: #0e1110;
    --y0: #3987e5; --y1: #d95926; --y2: #199e70;
    --good: #2fbf2f; --bad: #f07a7a;
    --good-wash: rgba(12,163,12,0.16); --bad-wash: rgba(230,103,103,0.16); --warn-wash: rgba(250,178,25,0.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1110; --surface: #171b19; --ink: #f3f5f4; --ink-2: #c0c7c3; --muted: #8a918d;
  --grid: #262c29; --axis: #39403c; --zero: #6b736e; --border: rgba(255,255,255,0.10); --accent: #5cc4a6; --accent-ink: #0e1110;
  --y0: #3987e5; --y1: #d95926; --y2: #199e70;
  --good: #2fbf2f; --bad: #f07a7a;

  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 48px; display: grid; gap: 22px; }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--ink-2); max-width: 70ch; }
.status { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill.live .dot { background: var(--good); }
.pill.warn .dot { background: #e0a000; }
button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .55; cursor: default; }

.tabs { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 3px; border-radius: 9px; background: var(--grid); justify-self: start; }
.tabs button { border: none; background: transparent; padding: 7px 18px; font-size: 14px; font-weight: 600; color: var(--ink-2); border-radius: 7px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tabs button:hover { border: none; color: var(--ink); }
.tabs button[aria-selected="true"]:hover { color: var(--accent-ink); }

.view { display: grid; gap: 22px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; color: var(--ink-2); font-size: 13px; }
.controls label { display: inline-flex; gap: 8px; align-items: center; }
select { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
.msg { font-size: 13px; color: var(--ink-2); padding: 8px 12px; border-radius: 6px; background: var(--warn-wash); }
.sect { margin: 6px 0 -8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.grp { grid-column: 1 / -1; margin: 6px 0 -4px; font-size: 15px; font-weight: 700; color: var(--ink); }
.grp:first-child { margin-top: 0; }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpis.solo { grid-template-columns: minmax(0, 440px); }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.kpi.total { border-color: var(--axis); }
.kpi.wide { grid-column: span 2; }
.kpi h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-2); }
.kpi .big { font-size: 32px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .big small { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 4px; }
.kpi .period { font-size: 12.5px; color: var(--muted); }
.kpi .lag { font-size: 12px; color: var(--ink-2); background: var(--warn-wash); padding: 3px 8px; border-radius: 4px; justify-self: start; }
.deltas { display: grid; gap: 6px; }
.delta { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.delta .vs { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.delta .abs { color: var(--muted); font-family: var(--mono); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 4px; justify-self: start; }
.chip.good { color: var(--good); background: var(--good-wash); }
.chip.bad { color: var(--bad); background: var(--bad-wash); }
.chip.flat { color: var(--ink-2); background: var(--grid); }

.charts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.charts.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.charts.solo { grid-template-columns: minmax(0, 1fr); }
.chart { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 14px 10px; min-width: 0; position: relative; }
.chart.wide { grid-column: 1 / -1; }
.chart h3 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
.chart .unit { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; }
.legend i.dash { border-top-style: dashed; }
.plot { position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.plot text { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); }
.plot .lbl { font-family: var(--font); font-size: 11.5px; font-weight: 600; fill: var(--ink); }
.plot .zone { font-family: var(--font); font-size: 11px; fill: var(--ink-2); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 4px 14px rgba(0,0,0,.12); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; min-width: 170px; z-index: 2; }
.tip b { display: block; margin-bottom: 4px; }
.tip .r { display: grid; grid-template-columns: 10px 1fr auto; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.tip .r i { width: 8px; height: 8px; border-radius: 50%; }
.tip .d { color: var(--muted); font-size: 11.5px; margin-top: 4px; }

.tablebox { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; display: grid; gap: 10px; }
.tablehead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.tablebox h3 { margin: 0; font-size: 15px; font-weight: 600; }
.tscroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { color: var(--ink-2); font-weight: 600; font-size: 12px; }
thead tr.hg th { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; border-bottom: none; padding-bottom: 0; }
td.sep, th.sep { border-left: 1px solid var(--grid); }
td.good { color: var(--good); } td.bad { color: var(--bad); }
tr.cut td { background: var(--warn-wash); }
.note { font-size: 12.5px; color: var(--muted); max-width: 90ch; margin: 0; }

@media (max-width: 1080px) { .charts.c4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }

    note: "Gli importi sono attribuiti al mese di competenza della bolletta (colonne ANNO e MESE CIFRE), non alla data di emissione. Note di credito e conguagli negativi riducono il totale del mese. Lo scostamento confronta la spesa cumulata allo stesso mese: in verde se spendi meno, in rosso se spendi di più. Se un servizio non ha ancora bollette fino al mese di confronto, il riquadro lo segnala: il confronto per quel servizio risulta più basso del reale finché la bolletta non arriva.",
    load(rows) {
      const data = {}; const seen = new Set();
      for (const [y, m, s, v] of rows) {
        if (!y || !m || !s || v == null || isNaN(v)) continue;
        const k = String(s).trim().toUpperCase(); seen.add(k);
        const d = ((data[k] = data[k] || {})[y] = data[k][y] || {});
        d[m] = (d[m] || 0) + +v;
      }
      this.data = data;
      this.services = B_KNOWN.filter((x) => seen.has(x.key)).concat([...seen].filter((k) => !B_KNOWN.some((x) => x.key === k)).sort().map((k) => ({ key: k, label: k.charAt(0) + k.slice(1).toLowerCase() })))
        .map((s) => Object.assign({ higherIsGood: false }, s));
    },
    metrics() { return [B_TOTAL, ...this.services]; },
    keysOf(mt) { return mt.total ? this.services.map((s) => s.key) : [mt.key]; },
    monthVal(mt, y, m) { let s = 0; for (const k of this.keysOf(mt)) { const v = this.data[k] && this.data[k][y] && this.data[k][y][m]; if (v != null) s += v; } return s; },
    lastSvc(k, y) { const d = this.data[k] && this.data[k][y]; return d ? Math.max(0, ...Object.keys(d).map(Number)) : 0; },
    lastMonth(y) { return Math.max(0, ...this.services.map((s) => this.lastSvc(s.key, y))); },
    years() {
      const all = new Set(); this.services.forEach((s) => Object.keys(this.data[s.key] || {}).forEach((y) => all.add(+y)));
      return [...all].filter((y) => all.has(y - 1) && all.has(y - 2) && this.lastMonth(y) > 0).sort((a, b) => b - a);
    },
    series(mt, y) { const lm = this.lastMonth(y); const out = []; let s = 0; for (let m = 1; m <= lm; m++) { s += this.monthVal(mt, y, m); out.push(s); } return out; },
    big(mt, v) { return v == null ? "–" : eur0.format(v); },
    val(mt, v) { return v == null ? "–" : eur2.format(v); },
    cell(mt, v) { return v == null ? "–" : eur2.format(v); },
    tick(mt, v) { return "€" + minus(nf0.format(v)); },
    endLabel(mt, v) { return eur0.format(v); },
    abs(mt, cur, ref) { return signed(cur - ref, eur0); },
    unit() { return "€ cumulati da gennaio"; },
    tableTitle(mt) { return `${mt.label}: spesa progressiva mese per mese`; },
    delta(mt, cur, ref) { if (cur == null || !ref) return null; return { v: (cur - ref) / ref * 100, unit: "%" }; },
    lag(mt, Y, M) {
      const late = this.keysOf(mt).map((k) => ({ k, lm: this.lastSvc(k, Y) })).filter((x) => x.lm < M);

      if (mt.total) return `<div class="lag">Bollette mancanti: ${late.map((x) => name(x.k) + (x.lm ? " (fermo a " + MESI_L[x.lm - 1] + ")" : " (nessuna)")).join(", ")}</div>`;
      return `<div class="lag">${late[0].lm ? "Ultima bolletta: " + MESI_L[late[0].lm - 1] : "Nessuna bolletta nel " + Y}</div>`;
    },
    single(mt, y, m) { return m <= this.lastMonth(y) ? this.monthVal(mt, y, m) : null; }
  };

  // ——— Vista Gas ———
  const G_METRICS = [{ key: "smc", label: "Consumo gas", higherIsGood: false }];
  function sheetDate(v) {
    if (v instanceof Date) return new Date(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate()));
    if (typeof v === "number") return new Date(Math.round((v - 25569) * 86400000));
    const s = String(v == null ? "" : v).trim();
    const m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
    if (m) return new Date(Date.UTC(+m[3] < 100 ? 2000 + +m[3] : +m[3], +m[2] - 1, +m[1]));
    const iso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (iso) return new Date(Date.UTC(+iso[1], +iso[2] - 1, +iso[3]));
    if (/^\d{4,5}$/.test(s)) return new Date(Math.round((+s - 25569) * 86400000));
    return null;
  }
  const gas = {
    id: "g", data: {}, year: null, month: null, tbl: "smc", lastRead: null,
    tableLabel: "Indicatore",
    note: "I consumi arrivano dalla tab Letture gas. Ogni lettura è attribuita al mese in cui il gas è stato consumato. Dal 2024 le letture sono di fine mese e valgono per quel mese, come nella tab Pivot consumi GAS. Le letture fatte entro il 15 del mese, presenti fino al 2023, valgono per il mese precedente: ad esempio quella del 02/01/2023 vale per dicembre 2022. Per questo nel 2022 e nel 2023 alcuni valori sono spostati di un mese rispetto alla pivot. Se una lettura copre più mesi, il consumo va tutto sull'ultimo. Lo scostamento confronta il consumo cumulato allo stesso mese: in verde se consumi meno, in rosso se consumi di più.",
    load(rows) {
      // rows: [data lettura, lettura, consumo]
      const by = {}; let prev = null, last = null;
      const list = rows.map((r) => ({ d: sheetDate(r[0]), l: r[1], c: r[2] })).filter((r) => r.d && !isNaN(r.d)).sort((a, b) => a.d - b.d);
      for (const r of list) {
        const c = r.c != null && !isNaN(r.c) ? +r.c : prev != null && r.l != null && !isNaN(r.l) ? r.l - prev : null;
        if (r.l != null && !isNaN(r.l)) prev = +r.l;
        if (c == null) continue;
        let y = r.d.getUTCFullYear(), m = r.d.getUTCMonth() + 1;
        if (r.d.getUTCDate() <= 15) { m -= 1; if (m === 0) { m = 12; y -= 1; } }
        (by[y] = by[y] || {})[m] = (by[y][m] || 0) + c;
        last = r.d;
      }
      this.data = by; this.lastRead = last;
    },
    metrics() { return G_METRICS; },
    lastMonth(y) { const d = this.data[y]; return d ? Math.max(0, ...Object.keys(d).map(Number)) : 0; },
    years() { return Object.keys(this.data).map(Number).filter((y) => this.lastMonth(y) > 0 && this.data[y - 1] && this.data[y - 2]).sort((a, b) => b - a); },
    monthVal(y, m) { return (this.data[y] && this.data[y][m]) || 0; },
    series(mt, y) { const lm = this.lastMonth(y); const out = []; let s = 0; for (let m = 1; m <= lm; m++) { s += this.monthVal(y, m); out.push(s); } return out; },
    big(mt, v) { return v == null ? "–" : `${nf0.format(v)}<small>Smc</small>`; },
    val(mt, v) { return v == null ? "–" : nf0.format(v) + " Smc"; },
    cell(mt, v) { return v == null ? "–" : nf0.format(v); },
    tick(mt, v) { return nf0.format(v); },
    endLabel(mt, v) { return nf0.format(v); },
    abs(mt, cur, ref) { return signed(cur - ref, nf0) + " Smc"; },
    unit() { return "Smc cumulati da gennaio, dalle letture del contatore"; },
    tableTitle() { return "Consumo gas: progressivo mese per mese (Smc)"; },
    delta(mt, cur, ref) { if (cur == null || !ref) return null; return { v: (cur - ref) / ref * 100, unit: "%" }; },
    lag() { return this.lastRead ? `<div class="period">Ultima lettura: ${this.lastRead.toLocaleDateString("it-IT", { timeZone: "UTC" })}</div>` : ""; },
    single(mt, y, m) { return m <= this.lastMonth(y) ? this.monthVal(y, m) : null; }
  };

  // ——— Vista Costi (luce e gas) ———
  const C_SVCS = [
    { k: "L", src: "ENERGIA ELETTRICA", name: "Luce", unit: "kWh", dec: 3 },
    { k: "G", src: "GAS", name: "Gas", unit: "Smc", dec: 2 }
  ];
  const C_METRICS = C_SVCS.flatMap((s) => [
    { key: s.k + "_tot", svc: s, part: "tot", group: s.name, label: "Costo totale", higherIsGood: false, total: true },
    { key: s.k + "_fix", svc: s, part: "fix", group: s.name, label: "Quota fissa", higherIsGood: false, split: true },
    { key: s.k + "_var", svc: s, part: "var", group: s.name, label: "Quota variabile", higherIsGood: false, split: true },
    { key: s.k + "_unit", svc: s, part: "unit", group: s.name, label: `Costo medio per ${s.unit}`, higherIsGood: false }
  ]);
  const ufmt = {};
  C_SVCS.forEach((s) => { ufmt[s.k] = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", minimumFractionDigits: s.dec, maximumFractionDigits: s.dec }); });
  const costs = {
    id: "c", data: {}, year: null, month: null, tbl: "L_tot",
    tableLabel: "Voce", kpiClass: "k4", chartClass: "c4", monthlyAll: true,
    note: "I costi arrivano dalla tab BOLLETTE, per mese di competenza: luce = ENERGIA ELETTRICA, gas = GAS. Quota fissa e quota variabile sono registrate nel foglio solo dal 2025: per gli anni precedenti il confronto su queste due voci non è disponibile (n.d.), mentre il costo totale si confronta con entrambi gli anni. Se completi le colonne QUOTA FISSA e QUOTA VARIABILE di un anno intero, il confronto compare da solo. Il costo medio è la spesa totale divisa per il consumo indicato in bolletta (kWh prelevati dalla rete per la luce, Smc per il gas), cumulati da gennaio: comprende anche la quota fissa, quindi sale quando consumi poco. Note di credito e conguagli negativi riducono la spesa del mese. In verde se spendi meno, in rosso se spendi di più.",
    load(rows) {
      // rows: [anno, mese, servizio, importo, consumo, quota fissa, quota variabile]
      const d = {};
      for (const [y, m, s, imp, cons, fx, vr] of rows) {
        const name = String(s == null ? "" : s).trim().toUpperCase();
        const svc = C_SVCS.find((x) => x.src === name || x.k === name);
        if (!svc || !y || !m || imp == null || isNaN(imp)) continue;
        const Y = ((d[svc.k] = d[svc.k] || {})[y] = d[svc.k][y] || { months: {}, split: true });
        const r = (Y.months[m] = Y.months[m] || { tot: 0, cons: 0, fix: 0, var: 0 });
        r.tot += +imp;
        if (cons != null && !isNaN(cons)) r.cons += +cons;
        if (fx == null || vr == null || isNaN(fx) || isNaN(vr)) Y.split = false; else { r.fix += +fx; r.var += +vr; }
      }
      this.data = d;
    },
    metrics() { return C_METRICS; },
    yr(mt, y) { return this.data[mt.svc.k] && this.data[mt.svc.k][y]; },
    lastSvc(k, y) { const Y = this.data[k] && this.data[k][y]; return Y ? Math.max(0, ...Object.keys(Y.months).map(Number)) : 0; },
    lastMonth(y) { return Math.max(0, ...C_SVCS.map((s) => this.lastSvc(s.k, y))); },
    years() {
      const all = new Set(); C_SVCS.forEach((s) => Object.keys(this.data[s.k] || {}).forEach((y) => all.add(+y)));
      return [...all].filter((y) => all.has(y - 1) && all.has(y - 2) && this.lastMonth(y) > 0).sort((a, b) => b - a);
    },
    series(mt, y) {
      const Y = this.yr(mt, y), lm = this.lastMonth(y);
      if (!Y) return [];
      if (mt.split && !Y.split) return Array(lm).fill(null);
      const out = []; let s = 0, c = 0;
      for (let m = 1; m <= lm; m++) {
        const r = Y.months[m];
        if (mt.part === "unit") { if (r) { s += r.tot; c += r.cons; } out.push(c > 0 ? s / c : null); }
        else { if (r) s += r[mt.part]; out.push(s); }
      }
      return out;
    },
    single(mt, y, m) {
      const Y = this.yr(mt, y);
      if (!Y || m > this.lastMonth(y) || (mt.split && !Y.split)) return null;
      const r = Y.months[m];
      if (mt.part === "unit") return r && r.cons > 0 ? r.tot / r.cons : null;
      return r ? r[mt.part] : 0;
    },
    isUnit(mt) { return mt.part === "unit"; },
    big(mt, v) { return v == null ? "–" : this.isUnit(mt) ? `${ufmt[mt.svc.k].format(v)}<small>/${mt.svc.unit}</small>` : eur0.format(v); },
    val(mt, v) { return v == null ? "–" : this.isUnit(mt) ? `${ufmt[mt.svc.k].format(v)}/${mt.svc.unit}` : eur2.format(v); },
    cell(mt, v) { return v == null ? "–" : this.isUnit(mt) ? ufmt[mt.svc.k].format(v) : eur2.format(v); },
    tick(mt, v) { return "€" + (this.isUnit(mt) ? nf2.format(v) : minus(nf0.format(v))); },
    endLabel(mt, v) { return this.isUnit(mt) ? ufmt[mt.svc.k].format(v) : eur0.format(v); },
    abs(mt, cur, ref, ry) { return this.isUnit(mt) ? `${ry}: ${ufmt[mt.svc.k].format(ref)}` : signed(cur - ref, eur0); },
    na(mt, ry) { const Y = this.yr(mt, ry); return mt.split && Y && !Y.split ? "non registrata" : ""; },
    unit(mt) {
      if (this.isUnit(mt)) return `Spesa totale ÷ ${mt.svc.unit} in bolletta, cumulati da gennaio`;
      return mt.split ? "€ cumulati da gennaio · registrata dal 2025" : "€ cumulati da gennaio";
    },
    tableTitle(mt) { return `${mt.group} · ${mt.label}: mese per mese e progressivo`; },
    delta(mt, cur, ref) { if (cur == null || ref == null || !ref) return null; return { v: (cur - ref) / ref * 100, unit: "%" }; },
    lag(mt, Y, M) {
      const lm = this.lastSvc(mt.svc.k, Y);
      if (lm >= M) return "";
      return `<div class="lag">${lm ? "Ultima bolletta: " + MESI_L[lm - 1] : "Nessuna bolletta nel " + Y}</div>`;
    }
  };

  const VIEWS = { e: energy, b: bills, g: gas, c: costs };
  const ALL = [energy, bills, gas, costs];
  const TABS = ["e", "b", "g", "c"];
  let active = "e";

  // ——— Rendering comune ———
  const deltaStr = (d) => (d.v >= 0 ? "+" : "−") + nf1.format(Math.abs(d.v)) + d.unit;
  const tone = (mt, d) => (!d || Math.abs(d.v) < 0.05 ? "flat" : (d.v > 0) === mt.higherIsGood ? "good" : "bad");
  function chip(V, mt, cur, ref) {
    const d = V.delta(mt, cur, ref);
    if (!d) return '<span class="chip flat">n.d.</span>';
    const t = tone(mt, d);
    if (t === "flat") return `<span class="chip flat">= 0,0${d.unit}</span>`;
    return `<span class="chip ${t}" title="${t === "good" ? "favorevole" : "sfavorevole"}">${d.v > 0 ? "▲" : "▼"} ${deltaStr(d)}</span>`;
  }
  const legendHtml = (years) => years.map((y, k) => `<span><i class="${k === 2 ? "dash" : ""}" style="border-color:var(--y${k})"></i>${y}${k === 0 ? " (in corso)" : ""}</span>`).join("");
  const label = (mt) => (mt.group ? mt.group + " · " : "") + mt.label;
  function niceStep(x) {
    if (!(x > 0)) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(x)));
    for (const f of [1, 2, 2.5, 5, 10]) if (f * p >= x - 1e-12) return f * p;
    return 10 * p;
  }
  function grouped(V, cell) {
    let out = "", g = null;
    V.metrics().forEach((mt, i) => {
      if (mt.group && mt.group !== g) { g = mt.group; out += `<h3 class="grp">${g}</h3>`; }
      out += cell(mt, i);
    });
    return out;
  }

  function buildShell(V) {
    const p = V.id, one = V.metrics().length === 1;
    $("view-" + p).innerHTML = `
      <div class="controls">
        <label for="selYear-${p}">Anno <select id="selYear-${p}"></select></label>
        <label for="selMonth-${p}">Confronto fino a <select id="selMonth-${p}"></select></label>
        <span id="cmp-${p}"></span>
      </div>
      <p class="sect">Riepilogo</p>
      <div class="kpis ${one ? "solo" : V.kpiClass || ""}" id="kpis-${p}"></div>
      <p class="sect">Andamento progressivo</p>
      <div class="charts ${one ? "solo" : V.chartClass || ""}" id="charts-${p}"></div>
      <div class="tablebox">
        <div class="tablehead"><h3 id="tblTitle-${p}"></h3><label for="selTbl-${p}" class="controls"${one ? " hidden" : ""}>${V.tableLabel} <select id="selTbl-${p}"></select></label></div>
        <div class="tscroll"><table id="tbl-${p}"></table></div>
      </div>

    $("selYear-" + p).addEventListener("change", (e) => { V.year = +e.target.value; V.month = null; fillControls(V, true); render(V); });
    $("selMonth-" + p).addEventListener("change", (e) => { V.month = +e.target.value; render(V); });

  }

  function fillControls(V, keep) {
    const p = V.id, ys = V.years();
    if (!ys.length) return;
    if (!keep || !ys.includes(V.year)) V.year = ys[0];
    $("selYear-" + p).innerHTML = ys.map((y) => `<option value="${y}" ${y === V.year ? "selected" : ""}>${y}</option>`).join("");
    const lm = V.lastMonth(V.year);
    if (!V.month || V.month > lm || !keep) V.month = lm;
    $("selMonth-" + p).innerHTML = Array.from({ length: lm }, (_, i) => `<option value="${i + 1}" ${i + 1 === V.month ? "selected" : ""}>${MESI_L[i]}</option>`).join("");
    if (!V.metrics().some((m) => m.key === V.tbl)) V.tbl = V.metrics()[0].key;
    $("selTbl-" + p).innerHTML = V.metrics().map((m) => `<option value="${m.key}" ${m.key === V.tbl ? "selected" : ""}>${label(m)}</option>`).join("");
  }

  function render(V) {
    const p = V.id, Y = V.year, M = V.month;
    if (!Y || !M) return;
    $("cmp-" + p).textContent = `Periodo: gennaio → ${MESI_L[M - 1]} di ogni anno`;
    $("kpis-" + p).innerHTML = grouped(V, (mt) => {
      const cur = V.series(mt, Y)[M - 1];
      const rows = [Y - 1, Y - 2].map((ry) => {
        const ref = V.series(mt, ry)[M - 1];
        const abs = ref != null && cur != null ? V.abs(mt, cur, ref, ry) : V.na ? V.na(mt, ry) : "";
        return `<div class="delta"><span class="vs">vs ${ry}</span>${chip(V, mt, cur, ref)}<span class="abs">${abs}</span></div>`;
      }).join("");
      const cls = (mt.total ? " total" : "") + (mt.wide ? " wide" : "");
      return `<article class="kpi${cls}"><h2>${mt.label}</h2><div class="big">${V.big(mt, cur)}</div><div class="period">${Y}, gennaio → ${MESI_L[M - 1]}</div>${V.extra ? V.extra(mt, Y, M) : ""}${V.lag(mt, Y, M)}<div class="deltas">${rows}</div></article>`;
    });
    const years = [Y, Y - 1, Y - 2];
    $("charts-" + p).innerHTML = grouped(V, (mt, i) => `<article class="chart${mt.wide ? " wide" : ""}"><h3>${mt.label}</h3><p class="unit">${V.unit(mt)}</p><div class="legend">${legendHtml(years)}</div><div class="plot" id="plot-${p}-${i}"></div></article>`);
    drawAll(V);
    renderTable(V);
  }

  function drawAll(V) {
    if ($("view-" + V.id).hidden || !V.year) return;
    const years = [V.year, V.year - 1, V.year - 2];
    V.metrics().forEach((mt, i) => { const el = $(`plot-${V.id}-${i}`); if (el) drawChart(V, el, mt, years); });
  }

  function drawChart(V, el, mt, years) {
    const M = V.month;
    const W = Math.max(260, el.clientWidth || 360), H = Math.round(Math.min(300, Math.max(220, W * 0.62)));
    const pad = { l: 52, r: 62, t: 12, b: 26 };
    const series = years.map((y) => V.series(mt, y));
    const flat = series.flat().filter((v) => v != null);
    const lo = Math.min(0, ...flat), hi = Math.max(0, ...flat);
    const step = niceStep(((hi - lo) || 1) / 4);
    const min = Math.floor(lo / step + 1e-9) * step;
    let max = Math.ceil(hi / step - 1e-9) * step; if (max <= min) max = min + step;
    const x = (m) => pad.l + (m - 1) * (W - pad.l - pad.r) / 11;
    const y = (v) => H - pad.b - (v - min) / (max - min) * (H - pad.t - pad.b);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label(mt)}: progressivo ${years.join(", ")}">`;
    const zones = V.zones ? V.zones(mt) : null;
    if (zones && min < 0 && max > 0) {
      s += `<rect x="${pad.l}" y="${pad.t}" width="${W - pad.l - pad.r}" height="${y(0) - pad.t}" fill="var(--bad-wash)"/>`;
      s += `<rect x="${pad.l}" y="${y(0)}" width="${W - pad.l - pad.r}" height="${H - pad.b - y(0)}" fill="var(--good-wash)"/>`;
      s += `<text class="zone" x="${pad.l + 8}" y="${pad.t + 14}">▲ ${zones[0]}</text>`;
      s += `<text class="zone" x="${pad.l + 8}" y="${H - pad.b - 8}">▼ ${zones[1]}</text>`;
    }
    for (let v = min, n = 0; v <= max + step * 1e-6 && n < 12; v += step, n++) {
      const yy = y(v), zero = Math.abs(v) < step * 1e-6;
      s += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${yy}" y2="${yy}" stroke="var(--${zero ? (min < 0 ? "zero" : "axis") : "grid"})" stroke-width="${zero && min < 0 ? 1.5 : 1}"/>`;
      s += `<text x="${pad.l - 6}" y="${yy + 3.5}" text-anchor="end">${V.tick(mt, zero ? 0 : v)}</text>`;
    }
    for (let m = 1; m <= 12; m++) s += `<text x="${x(m)}" y="${H - pad.b + 16}" text-anchor="middle">${MESI[m - 1]}</text>`;
    s += `<line x1="${x(M)}" x2="${x(M)}" y1="${pad.t}" y2="${H - pad.b}" stroke="var(--axis)" stroke-dasharray="2 3"/>`;
    for (let k = years.length - 1; k >= 0; k--) {
      const pts = series[k]; if (!pts.length) continue;
      let d = "", pen = false;
      pts.forEach((v, j) => { if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${x(j + 1).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
      if (d) s += `<path d="${d}" fill="none" stroke="var(--y${k})" stroke-width="${k === 0 ? 2.75 : 2}" stroke-linejoin="round" stroke-linecap="round" ${k === 2 ? 'stroke-dasharray="5 4"' : ""}/>`;
      const mm = Math.min(M, pts.length), v = pts[mm - 1];
      if (v != null) s += `<circle cx="${x(mm)}" cy="${y(v)}" r="${k === 0 ? 4.5 : 3.5}" fill="var(--y${k})" stroke="var(--surface)" stroke-width="2"/>`;
    }
    const cur = series[0][M - 1];
    if (cur != null) s += `<text class="lbl" x="${x(M) + 8}" y="${y(cur) + 4}">${V.endLabel(mt, cur)}</text>`;
    s += `<line class="xh" x1="0" x2="0" y1="${pad.t}" y2="${H - pad.b}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`;
    s += `<rect x="${pad.l - 10}" y="0" width="${W - pad.l - pad.r + 20}" height="${H}" fill="transparent"/>`;
    s += `</svg><div class="tip" hidden></div>`;
    el.innerHTML = s;

    const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), xh = el.querySelector(".xh");
    function show(evt) {
      const r = svg.getBoundingClientRect();
      const px = (evt.clientX - r.left) * W / r.width;
      const m = Math.max(1, Math.min(12, Math.round((px - pad.l) / ((W - pad.l - pad.r) / 11)) + 1));
      xh.setAttribute("x1", x(m)); xh.setAttribute("x2", x(m)); xh.setAttribute("visibility", "visible");
      const vals = series.map((sr) => sr[m - 1]);
      let h = `<b>Gen → ${MESI_L[m - 1]}</b>`;
      years.forEach((yy, k) => { h += `<div class="r"><i style="background:var(--y${k})"></i><span>${yy}</span><span>${V.val(mt, vals[k])}</span></div>`; });
      const parts = [1, 2].map((k) => { const d = V.delta(mt, vals[0], vals[k]); return d ? `vs ${years[k]}: ${deltaStr(d)}` : null; }).filter(Boolean);
      if (parts.length) h += `<div class="d">${parts.join(" · ")}</div>`;
      tip.innerHTML = h; tip.hidden = false;
      const left = (x(m) / W) * r.width; const tw = tip.offsetWidth;
      tip.style.left = Math.max(0, Math.min(r.width - tw, left + (left > r.width / 2 ? -tw - 12 : 12))) + "px";
      tip.style.top = "8px";
    }
    function hide() { tip.hidden = true; xh.setAttribute("visibility", "hidden"); }
    svg.addEventListener("pointermove", show);
    svg.addEventListener("pointerdown", show);
    svg.addEventListener("pointerleave", hide);
  }

  function renderTable(V) {
    const p = V.id, Y = V.year, M = V.month, years = [Y, Y - 1, Y - 2];
    const mt = V.metrics().find((m) => m.key === V.tbl) || V.metrics()[0];
    $("tblTitle-" + p).textContent = V.tableTitle(mt);
    const ser = years.map((y) => V.series(mt, y));
    const cell = (v0, v1, first) => { const d = V.delta(mt, v0, v1); return d ? `<td class="${tone(mt, d)}${first ? " sep" : ""}">${deltaStr(d)}</td>` : `<td${first ? ' class="sep"' : ""}>–</td>`; };
    let h;
    if (V.monthlyAll) {
      h = `<thead><tr class="hg"><th></th><th class="sep" colspan="3">Nel mese</th><th class="sep" colspan="3">Da gennaio</th><th class="sep" colspan="2">Scostamento da gennaio</th></tr>`;
      h += `<tr><th>Mese</th>${years.map((y, k) => `<th${k === 0 ? ' class="sep"' : ""}>${y}</th>`).join("")}${years.map((y, k) => `<th${k === 0 ? ' class="sep"' : ""}>${y}</th>`).join("")}<th class="sep">vs ${years[1]}</th><th>vs ${years[2]}</th></tr></thead><tbody>`;
      for (let m = 1; m <= 12; m++) {
        const mon = years.map((y) => V.single(mt, y, m)), v = ser.map((s) => s[m - 1]);
        h += `<tr class="${m === M ? "cut" : ""}"><td>${MESI[m - 1]}</td>${mon.map((x, k) => `<td${k === 0 ? ' class="sep"' : ""}>${V.cell(mt, x)}</td>`).join("")}${v.map((x, k) => `<td${k === 0 ? ' class="sep"' : ""}>${V.cell(mt, x)}</td>`).join("")}${cell(v[0], v[1], true)}${cell(v[0], v[2], false)}</tr>`;
      }
    } else {
      const one = !!V.single;
      h = `<thead><tr><th>Fino a</th>${one ? `<th class="sep">Mese ${years[0]}</th>` : ""}<th class="sep">${years[0]}</th><th>${years[1]}</th><th>${years[2]}</th><th class="sep">Δ vs ${years[1]}</th><th>Δ vs ${years[2]}</th></tr></thead><tbody>`;
      for (let m = 1; m <= 12; m++) {
        const v = ser.map((s) => s[m - 1]);
        h += `<tr class="${m === M ? "cut" : ""}"><td>${MESI[m - 1]}</td>${one ? `<td class="sep">${V.cell(mt, V.single(mt, Y, m))}</td>` : ""}<td class="sep">${V.cell(mt, v[0])}</td><td>${V.cell(mt, v[1])}</td><td>${V.cell(mt, v[2])}</td>${cell(v[0], v[1], true)}${cell(v[0], v[2], false)}</tr>`;
      }
    }
    $("tbl-" + p).innerHTML = h + "</tbody>";
  }

  // ——— Selettore delle viste ———
  function setTab(id, focus) {
    active = id;
    TABS.forEach((k) => {
      const on = k === id;
      $("tab-" + k).setAttribute("aria-selected", on ? "true" : "false");
      $("tab-" + k).tabIndex = on ? 0 : -1;
      $("view-" + k).hidden = !on;
    });
    if (focus) $("tab-" + id).focus();
    drawAll(VIEWS[id]);
    try { localStorage.setItem("gc-tab", id); } catch (_) {}
  }
  TABS.forEach((k) => $("tab-" + k).addEventListener("click", () => setTab(k)));
  document.querySelector(".tabs").addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); const i = TABS.indexOf(active), step = e.key === "ArrowRight" ? 1 : TABS.length - 1; setTab(TABS[(i + step) % TABS.length], true); }
  });

  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => drawAll(VIEWS[active]), 150); });


  // ——— Aggiornamento dal foglio (app Android: il file xlsx arriva dal lato nativo in base64) ———
  function setSource(kind, text) {
    const p = $("srcPill"); p.classList.remove("live", "warn"); if (kind) p.classList.add(kind);
    $("srcText").textContent = text;
  }
  function showMsg(t) { const m = $("msg"); if (t) { m.textContent = t; m.hidden = false; } else m.hidden = true; }

  const up = (c) => String(c == null ? "" : c).trim().toUpperCase();
  const num = (v) => (v === null || v === "" ? null : typeof v === "number" ? v : parseFloat(String(v).replace(/[€\s]/g, "").replace(/\./g, "").replace(",", ".")));
  function sheetRows(wb, name, must) {
    const ws = wb.Sheets[name];
    if (!ws) throw { code: "parse", message: `Nel foglio non trovo la tab "${name}".` };
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
    const hi = rows.findIndex((r) => r && must.every((n) => r.some((c) => up(c) === n)));
    if (hi < 0) throw { code: "parse", message: `Nella tab ${name} non trovo le colonne ${must.join(", ")}.` };
    return { hdr: rows[hi].map(up), rows: rows.slice(hi + 1) };
  }
  function parseEnergy(wb) {
    const { hdr, rows } = sheetRows(wb, "CONSUMI ELETTRICI", ["ANNO", "MESE", "CONSUMO TOT", "PRODOTTO", "IMMESSO"]);
    const c = (n) => hdr.indexOf(n);
    const ci = { y: c("ANNO"), m: c("MESE"), c: c("CONSUMO TOT"), p: c("PRODOTTO"), i: c("IMMESSO"), pr: c("TOT PRELEVATO"), ac: c("AUTOCONSUMO") };
    const opt = (r, k) => (k >= 0 ? num(r[k]) : null);
    return rows.map((r) => [num(r[ci.y]), num(r[ci.m]), num(r[ci.c]), num(r[ci.p]), num(r[ci.i]), opt(r, ci.pr), opt(r, ci.ac)]).filter((r) => r[0] && r[1] && r[2] != null);
  }
  function parseBills(wb) {
    const { hdr, rows } = sheetRows(wb, "BOLLETTE", ["SERVIZI", "ANNO", "MESE CIFRE", "IMPORTO"]);
    const ci = { s: hdr.indexOf("SERVIZI"), y: hdr.indexOf("ANNO"), m: hdr.indexOf("MESE CIFRE"), v: hdr.indexOf("IMPORTO") };
    return rows.map((r) => [num(r[ci.y]), num(r[ci.m]), r[ci.s], num(r[ci.v])]).filter((r) => r[0] && r[1] && r[2] && r[3] != null && !isNaN(r[3]));
  }
  function parseCosts(wb) {
    const { hdr, rows } = sheetRows(wb, "BOLLETTE", ["SERVIZI", "ANNO", "MESE CIFRE", "IMPORTO"]);
    const f = (pre) => hdr.findIndex((h) => h.startsWith(pre));
    const ci = { s: hdr.indexOf("SERVIZI"), y: hdr.indexOf("ANNO"), m: hdr.indexOf("MESE CIFRE"), v: hdr.indexOf("IMPORTO"), c: hdr.indexOf("CONSUMI"), fx: f("QUOTA FISSA"), vr: f("QUOTA VARIABILE") };
    const opt = (r, k) => (k >= 0 ? num(r[k]) : null);
    return rows.map((r) => [num(r[ci.y]), num(r[ci.m]), r[ci.s], num(r[ci.v]), opt(r, ci.c), opt(r, ci.fx), opt(r, ci.vr)]).filter((r) => r[0] && r[1] && r[2] && r[3] != null && !isNaN(r[3]));
  }
  function parseGas(wb) {
    const { hdr, rows } = sheetRows(wb, "Letture gas", ["DATA LETTURA", "LETTURA"]);
    const ci = { d: hdr.indexOf("DATA LETTURA"), l: hdr.indexOf("LETTURA"), c: hdr.findIndex((h) => h.startsWith("CONSUMO")) };
    const usable = rows.map((r) => [r[ci.d], num(r[ci.l]), ci.c >= 0 ? num(r[ci.c]) : null])
      .filter((r) => r[0] != null && r[0] !== "" && (r[1] != null || r[2] != null));
    const withDate = usable.filter((r) => { const d = sheetDate(r[0]); return d && !isNaN(d); });
    if (usable.length && !withDate.length) {
      throw { code: "parse", message: `Nella tab Letture gas le date non sono riconosciute (esempio: "${usable[0][0]}").` };
    }
    return usable;
  }

  function explain(err) {
    switch (err && err.code) {
      case "parse": return err.message;
      default: return `Non riesco a leggere il foglio${err && err.message ? " (" + err.message + ")" : ""}.`;
    }
  }

  // Chiamato dal lato Android con il JSON delle tab del foglio (dallo script Apps Script)
  window.onSheetJson = function (text) {
    try {
      const data = JSON.parse(text);
      if (data.error) throw { code: "parse", message: "Il foglio ha rifiutato la richiesta: controlla il token nell'indirizzo." };
      const wb = { Sheets: {} };
      Object.keys(data).forEach((name) => { if (data[name]) wb.Sheets[name] = XLSX.utils.aoa_to_sheet(data[name]); });
      const problems = [];
      try { energy.load(parseEnergy(wb)); } catch (e) { problems.push("Energia: " + explain(e)); }
      try { bills.load(parseBills(wb)); } catch (e) { problems.push("Bollette: " + explain(e)); }
      try { gas.load(parseGas(wb)); } catch (e) { problems.push("Gas: " + explain(e)); }
      try { costs.load(parseCosts(wb)); } catch (e) { problems.push("Costi: " + explain(e)); }
      if (problems.length === ALL.length) throw { code: "parse", message: problems.join(" ") };
      ALL.forEach((V) => { fillControls(V, true); render(V); });
      const stamp = new Date().toLocaleString("it-IT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
      setSource("live", "Dati dal foglio · " + stamp);
      showMsg(problems.length ? problems.join(" ") + " Per questa parte vedi la copia salvata." : "");
    } catch (err) {
      setSource("warn", "Copia dei dati al " + SNAP_DATE);
      showMsg(explain(err) + " Intanto vedi la copia salvata.");
    } finally { $("refresh").disabled = false; }
  };

  // Chiamato dal lato Android quando il download o l'accesso falliscono
  window.onWorkbookError = function (message) {
    setSource("warn", "Copia dei dati al " + SNAP_DATE);
    showMsg(message + " Intanto vedi la copia salvata.");
    $("refresh").disabled = false;
  };

  $("refresh").addEventListener("click", () => {
    if (!window.AndroidBridge) return;
    $("refresh").disabled = true;
    setSource("", "Lettura del foglio in corso…");
    AndroidBridge.refreshSheet();
  });
  $("address").addEventListener("click", () => { if (window.AndroidBridge) AndroidBridge.changeAddress(); });
  $("refresh").hidden = !window.AndroidBridge;
  $("address").hidden = !window.AndroidBridge;

  // ——— Avvio ———
  energy.load(SNAP_E); bills.load(SNAP_B); gas.load(SNAP_G); costs.load(SNAP_C);
  ALL.forEach((V) => { buildShell(V); fillControls(V, false); });
  let start = { "#energia": "e", "#bollette": "b", "#gas": "g", "#costi": "c" }[location.hash] || null;
  if (!start) { try { start = localStorage.getItem("gc-tab"); } catch (_) {} }
  ALL.forEach((V) => render(V));
  setTab(TABS.includes(start) ? start : "e");
})();
</script>

</body></html>
